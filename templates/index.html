
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizIG - Apprendre autrement</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172033;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 5px 20px #00000012;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
        }

        .progress {
            margin: 25px 0 10px;
            font-size: 14px;
            color: #64748b;
        }

        .bar {
            height: 8px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        #progressBar {
            height: 100%;
            width: 0%;
            background: #2563eb;
            transition: width 0.3s;
        }

        #question {
            margin: 25px 0 18px;
            font-size: 21px;
        }

        .answer {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 14px;
            text-align: left;
            font-size: 16px;
            color: #172033;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
        }

        .answer:hover {
            border-color: #2563eb;
        }

        .answer.selected {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .answer:disabled {
            cursor: default;
            opacity: 1;
        }

        #feedback {
            min-height: 25px;
            margin: 15px 0;
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .mainButton {
            flex: 1;
            min-width: 120px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .mainButton:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #result {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.6;
        }

        .hidden {
            display: none;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            font-size: 13px;
        }.resultCard {
    margin: 20px 0;
    padding: 20px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 16px;
}

.resultLabel {
    margin: 0;
    color: #64748b;
    font-size: 15px;
}

#result {
    margin: 12px 0 0;
    color: #1d4ed8;
    font-size: 22px;
    font-weight: bold;
    line-height: 1.8;
    white-space: pre-line;
}
    </style>
</head>
<body>
    <main class="container">
        <h1>🎓 QuizIG</h1>
        <p class="subtitle">Apprends, entraîne-toi et progresse !</p>

        <section id="quiz">
            <div class="progress">
                Question <span id="questionNumber">1</span> sur
                <span id="totalQuestions">5</span>
            </div>

            <div class="bar">
                <div id="progressBar"></div>
            </div>

            <h2 id="question"></h2>
            <div id="answers"></div>
            <p id="feedback" aria-live="polite"></p>

            <div class="actions">
                <button class="mainButton" id="validateButton">
                    Vérifier ma réponse
                </button>
                <button class="mainButton hidden" id="nextButton">
                    Question suivante
                </button>
            </div>
        </section>

        
<section id="finalResult" class="hidden">
    <h2>🏆 Quiz terminé !</h2>

    <div class="resultCard">
        <p class="resultLabel">Ta note finale</p>
        <p id="result"></p>
    </div>

    <button class="mainButton" id="restartButton">
        🔄 Recommencer le quiz
    </button>
</section>


        <footer>QuizIG — Ta réussite commence ici.</footer>
    </main>

    <script>
        const questions = [
            {
                question: "Que signifie IG ?",
                answers: [
                    "Intelligence Générale",
                    "Informatique de Gestion",
                    "Internet Graphique",
                    "Installation Globale"
                ],
                correct: 1,
                explanation: "IG signifie Informatique de Gestion."
            },
            {
                question: "Quel langage structure le contenu d'une page web ?",
                answers: ["Python", "SQL", "HTML", "C"],
                correct: 2,
                explanation: "HTML organise le contenu d'une page web."
            },
            {
                question: "Quel langage ajoute du style à une page web ?",
                answers: ["CSS", "SQL", "Bash", "PHP"],
                correct: 0,
                explanation: "CSS gère notamment les couleurs et la mise en page."
            },
            {
                question: "Quel type de logiciel est Python ?",
                answers: [
                    "Un langage de programmation",
                    "Un navigateur web",
                    "Un système de fichiers",
                    "Un câble réseau"
                ],
                correct: 0,
                explanation: "Python est un langage de programmation."
            },
            {
                question: "À quoi sert principalement une base de données ?",
                answers: [
                    "À remplacer le clavier",
                    "À stocker et organiser des informations",
                    "À recharger le téléphone",
                    "À augmenter la luminosité"
                ],
                correct: 1,
                explanation: "Une base de données permet de stocker et organiser des informations."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedAnswer = null;
        let answered = false;

        const questionElement = document.getElementById("question");
        const answersElement = document.getElementById("answers");
        const feedbackElement = document.getElementById("feedback");
        const validateButton = document.getElementById("validateButton");
        const nextButton = document.getElementById("nextButton");
        const quizElement = document.getElementById("quiz");
        const finalResult = document.getElementById("finalResult");

        document.getElementById("totalQuestions").textContent =
            questions.length;

        function displayQuestion() {
            const q = questions[currentQuestion];

            selectedAnswer = null;
            answered = false;

            document.getElementById("questionNumber").textContent =
                currentQuestion + 1;

            document.getElementById("progressBar").style.width =
                (currentQuestion / questions.length * 100) + "%";

            questionElement.textContent = q.question;
            answersElement.replaceChildren();
            feedbackElement.textContent = "";
            validateButton.disabled = true;
            validateButton.classList.remove("hidden");
            nextButton.classList.add("hidden");

            q.answers.forEach((answer, index) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "answer";
                button.textContent =
                    String.fromCharCode(65 + index) + ". " + answer;

                button.addEventListener("click", () => {
                    if (answered) return;

                    selectedAnswer = index;

                    document.querySelectorAll(".answer").forEach(item => {
                        item.classList.remove("selected");
                    });

                    button.classList.add("selected");
                    validateButton.disabled = false;
                });

                answersElement.appendChild(button);
            });
        }

        validateButton.addEventListener("click", () => {
            if (selectedAnswer === null || answered) return;

            answered = true;
            const q = questions[currentQuestion];
            const answerButtons = document.querySelectorAll(".answer");

            answerButtons.forEach((button, index) => {
                button.disabled = true;

                if (index === q.correct) {
                    button.style.borderColor = "#16a34a";
                    button.style.background = "#f0fdf4";
                }
            });

            if (selectedAnswer === q.correct) {
                score++;
                feedbackElement.textContent =
                    "✅ Bonne réponse ! " + q.explanation;
                feedbackElement.style.color = "#15803d";
            } else {
                feedbackElement.textContent =
                    "❌ Pas tout à fait. " + q.explanation;
                feedbackElement.style.color = "#b91c1c";
            }

            validateButton.classList.add("hidden");
            nextButton.classList.remove("hidden");

            if (currentQuestion === questions.length - 1) {
                nextButton.textContent = "Voir mon résultat";
            }
        });

        nextButton.addEventListener("click", () => {
            currentQuestion++;

            if (currentQuestion < questions.length) {
                displayQuestion();
            } else {
                showResult();
            }
        });

        function showResult() {
    quizElement.classList.add("hidden");
    finalResult.classList.remove("hidden");

    document.getElementById("progressBar").style.width = "100%";

    const total = questions.length;
    const mauvaises = total - score;
    const pourcentage = Math.round((score / total) * 100);

    let appreciation;

    if (pourcentage === 100) {
        appreciation = "🏆 Félicitations ! Score parfait !";
    } else if (pourcentage >= 80) {
        appreciation = "🌟 Excellent travail ! Continue ainsi !";
    } else if (pourcentage >= 60) {
        appreciation = "👏 Bon travail ! Tu progresses !";
    } else if (pourcentage >= 40) {
        appreciation = "💪 Courage ! Continue les révisions !";
    } else {
        appreciation = "📚 Révise encore et réessaie !";
    }

    document.getElementById("result").textContent =
        "Ton score : " + score + " / " + total +
        " (" + pourcentage + " %)" +
        "\nBonnes réponses : " + score +
        "\nMauvaises réponses : " + mauvaises +
        "\n" + appreciation;
}

        document.getElementById("restartButton").addEventListener("click", () => {
            currentQuestion = 0;
            score = 0;
            finalResult.classList.add("hidden");
            quizElement.classList.remove("hidden");
            nextButton.textContent = "Question suivante";
            displayQuestion();
        });

        displayQuestion();
    </script>
</body>
</html>
